<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload PDF | University AI Chatbot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="chat-container">

        <div class="logo">
            🤖
        </div>

        <h1>University AI Chatbot</h1>

        <p class="subtitle">
            Upload your notes and learn with AI.
        </p>

        <form
            action="{{ url_for('upload_pdf') }}"
            method="POST"
            enctype="multipart/form-data"
            class="upload-form"
        >

            <div class="upload-box">

                <h2>📄 Upload Your PDF</h2>

                <p>
                    Select your university notes to start asking questions.
                </p>

                <input
                    type="file"
                    name="pdf"
                    accept=".pdf"
                    required
                >

                <br><br>

                <button type="submit">
                    Upload PDF 🚀
                </button>

            </div>

        </form>

        <p class="footer">
            Only PDF files are supported.
        </p>

    </div>

</body>

</html>
